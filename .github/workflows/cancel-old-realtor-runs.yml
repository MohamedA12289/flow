name: Cancel superseded realtor export runs

on:
  push:
    branches:
      - temp-realtor-control-20260807
    paths:
      - ".github/workflows/cancel-old-realtor-runs.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-superseded-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded crawls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN_ID in 31145527635 31145747108 31146211489; do
            gh api --method POST \
              /repos/${{ github.repository }}/actions/runs/${RUN_ID}/cancel || true
            echo "Requested cancellation for superseded run ${RUN_ID}"
          done
