name: Temporary nationwide real-estate export and commit

on:
  push:
    branches:
      - temp-realtor-export-20260806
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-and-commit-export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: temp-realtor-export-20260806

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run nationwide public-data crawler
        run: python scripts/temp_realtor_export.py

      - name: Show output summary
        if: always()
        run: |
          test -f crawl_summary.json && cat crawl_summary.json || true
          test -f osm_real_estate_contacts.csv && wc -l -c osm_real_estate_contacts.csv || true

      - name: Commit generated export to temporary branch
        if: success()
        run: |
          mkdir -p generated-temp-export
          mv osm_real_estate_contacts.csv generated-temp-export/osm_real_estate_contacts.csv
          mv crawl_summary.json generated-temp-export/crawl_summary.json
          git config user.name "chatgpt-temporary-export"
          git config user.email "actions@users.noreply.github.com"
          git add generated-temp-export
          git commit -m "Add generated nationwide contact export [skip ci]"
          git push origin HEAD:temp-realtor-export-20260806

      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-real-estate-contact-export-committed
          path: |
            generated-temp-export/osm_real_estate_contacts.csv
            generated-temp-export/crawl_summary.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
