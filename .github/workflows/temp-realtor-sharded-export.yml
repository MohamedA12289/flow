name: Temporary sharded nationwide real-estate export

on:
  push:
    branches:
      - temp-realtor-sharded-20260806
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  crawl-and-persist-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: temp-realtor-sharded-20260806
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run and commit ten independent shards
        shell: bash
        run: |
          set -u
          git config user.name "chatgpt-temporary-export"
          git config user.email "actions@users.noreply.github.com"

          for shard in $(seq 0 9); do
            echo "========== STARTING SHARD ${shard} =========="
            rm -f "generated-temp-export/shard_$(printf '%02d' "$shard").csv"
            rm -f "generated-temp-export/shard_$(printf '%02d' "$shard")_summary.json"

            # A failed shard does not erase already committed progress.
            python scripts/temp_realtor_shard.py \
              --shard "$shard" \
              --total-shards 10 \
              --output-dir generated-temp-export || true

            csv_file="generated-temp-export/shard_$(printf '%02d' "$shard").csv"
            summary_file="generated-temp-export/shard_$(printf '%02d' "$shard")_summary.json"

            if [[ -s "$csv_file" && -s "$summary_file" ]]; then
              cat "$summary_file"
              wc -l -c "$csv_file"
              git add "$csv_file" "$summary_file"
              if ! git diff --cached --quiet; then
                git commit -m "Add nationwide contact shard ${shard} [skip ci]"
                git push origin HEAD:temp-realtor-sharded-20260806
              fi
            else
              echo "Shard ${shard} did not produce export files; continuing."
            fi
          done

      - name: Upload all completed shards as a backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-real-estate-contact-shards
          path: generated-temp-export/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
