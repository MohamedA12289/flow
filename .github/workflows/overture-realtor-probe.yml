name: Probe Overture real-estate places

on:
  push:
    branches:
      - temp-overture-realtor-20260807
    paths:
      - "scripts/overture_realtor_probe.py"
      - ".github/workflows/overture-realtor-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-overture-realtor-20260807

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check duckdb

      - name: Query Overture categories and samples
        run: python scripts/overture_realtor_probe.py

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: overture-realtor-probe
          path: overture_realtor_probe.json
          if-no-files-found: error
          retention-days: 3
